<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<defs>
 <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#69a8d6"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5c5"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
 <radialGradient id="bg"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#05070b"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .bone{fill:none;stroke:url(#bone);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .thin{fill:none;stroke:#8db9d8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #body{animation:float 2.8s ease-in-out infinite}
  #wingL{transform-box:fill-box;transform-origin:100% 100%;animation:flapL 1.05s ease-in-out infinite alternate}
  #wingR{transform-box:fill-box;transform-origin:0% 100%;animation:flapR 1.05s ease-in-out infinite alternate}
  #tail{transform-box:fill-box;transform-origin:0% 50%;animation:tail 1.8s ease-in-out infinite alternate}
  #eye{animation:eye 1.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes flapL{from{transform:rotate(-4deg)}to{transform:rotate(13deg)}}
  @keyframes flapR{from{transform:rotate(4deg)}to{transform:rotate(-13deg)}}
  @keyframes tail{from{transform:rotate(-2deg)}to{transform:rotate(4deg)}}
  @keyframes eye{0%,100%{opacity:.55}50%{opacity:1}}
 </style>
</defs>
<rect width="1200" height="330" rx="14" fill="url(#bg)"/>
