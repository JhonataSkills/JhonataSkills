name: Build animated dragon banner

on:
  push:
    paths:
      - 'dragon-code.svg'
      - '.github/workflows/dragon-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cairosvg pillow
      - name: Render moving dragon frames
        run: |
          cat > /tmp/render_dragon.py <<'PY'
          import io, math
          import cairosvg
          from PIL import Image
          from pathlib import Path

          source = Path("dragon-code.svg").read_text()
          frames = []
          for i in range(16):
              phase = 2 * math.pi * i / 16
              left = -12 * math.sin(phase)
              right = 12 * math.sin(phase)
              bob = 5 * math.sin(phase)
              svg = source
              svg = svg.replace('<g id="wingL" class="bone">', f'<g id="wingL" class="bone" transform="rotate({left:.2f} 622 170)">')
              svg = svg.replace('<g id="wingR" class="bone">', f'<g id="wingR" class="bone" transform="rotate({right:.2f} 654 170)">')
              svg = svg.replace('<g id="body">', f'<g id="body" transform="translate(0 {bob:.2f})">')
              png = cairosvg.svg2png(bytestring=svg.encode(), output_width=900, output_height=248)
              frames.append(Image.open(io.BytesIO(png)).convert("P", palette=Image.Palette.ADAPTIVE, colors=128))
          frames[0].save("dragon-banner.gif", save_all=True, append_images=frames[1:], duration=90, loop=0, optimize=True, disposal=2)
          PY
          python /tmp/render_dragon.py
      - name: Commit animated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dragon-banner.gif
          if ! git diff --cached --quiet; then
            git commit -m "Generate animated dragon banner [skip ci]"
            git push
          fi
